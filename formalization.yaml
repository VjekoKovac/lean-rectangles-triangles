# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Rectangles, triangles and Schrödinger waves"
  description: >-
    For a nonempty finite set A ⊂ ℤ², let B(A) count the ordered quadruples (a,b,c,e)
    in A⁴ with a+c=b+e and (b−a)·(e−a)=0. For k ∈ A, let Tₖ(A) count the ordered
    pairs (a,b) in A² equidistant from k. Both counts include repeated vertices.
    Let R(N) and P(N) be the respective suprema of B(A)/(∑ₖ∈A Tₖ(A)) and
    B(A)/(|A| maxₖ∈A Tₖ(A)) over A ⊂ [−N,N]² ∩ ℤ². Write R̃(n) and P̃(n)
    for the same suprema over all A ⊂ ℤ² of exactly n points.

    Theorem 1.2. Put G(c,x) = (log x)^(c / log(log(log x))), with natural logarithms.
    There exist a single absolute real c > 0, a real N₀ and a positive integer n₀
    such that R(N) ≥ P(N) ≥ G(c,N) for every real N ≥ N₀, and
    R̃(n) ≥ P̃(n) ≥ G(c,n) for every integer n ≥ n₀.

    For X = ℝᵈ or 𝕋ᵈ, let S(X,N) and M(X,N) be the optimal constants in the
    Stein and Mizohata–Takeuchi weighted Schrödinger inequalities, respectively,
    for Fourier support in the closed cube [−N,N]ᵈ. Here 𝕋 = ℝ/ℤ carries
    normalized Haar measure. On the torus, S̃(𝕋ᵈ,n) and M̃(𝕋ᵈ,n) denote the
    corresponding constants for exactly n nonzero Fourier coefficients at
    arbitrary lattice frequencies.

    Theorem 1.3. For every integer d ≥ 1 and real N ≥ 1,
    S(𝕋ᵈ,N) ≤ S(ℝᵈ,N+1) and M(𝕋ᵈ,N) ≤ M(ℝᵈ,N+1).

    Theorem 1.4. For every real N ≥ 1 and integer n ≥ 1,
    R(N) ≤ S(𝕋²,N), P(N) ≤ M(𝕋²,N),
    R̃(n) ≤ S̃(𝕋²,n), and P̃(n) ≤ M̃(𝕋²,n).

    Theorem 1.5. For each integer d ≥ 1 there are positive real constants a_d,
    b_d and B_d, a real N_d ≥ 1 and an integer n_d ≥ 1 such that, for every
    real N ≥ N_d, both S(𝕋ᵈ,N) and M(𝕋ᵈ,N) are at least a_d (log N)^d.
    For every integer n ≥ n_d, one has b_d n ≤ S̃(𝕋ᵈ,n) ≤ B_d n and
    b_d n ≤ M̃(𝕋ᵈ,n) ≤ B_d n.
  authors:
    - "Jonathan Bennett"
    - "Vjekoslav Kovač"
    - "Shohei Nakamura"
    - "Itamar Oliveira"
  responsible_maintainers: ["Vjekoslav Kovač"]
  license: "Apache-2.0"

